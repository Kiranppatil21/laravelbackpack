# Supervisor configuration for Laravel Queue Workers
# Place this file in: /etc/supervisor/conf.d/laravel-queue.conf

[program:laravel-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/security-service-saas/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/security-service-saas/storage/logs/worker.log
stopwaitsecs=3600
environment=
    APP_ENV=production,
    DB_CONNECTION=mysql

# Restart workers when code is deployed
[program:laravel-schedule]
process_name=%(program_name)s_%(process_num)02d  
command=php /var/www/security-service-saas/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/security-service-saas/storage/logs/schedule.log
environment=
    APP_ENV=production