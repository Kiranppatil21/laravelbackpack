# Redis configuration for production
# /etc/redis/redis.conf

# Basic Configuration
daemonize yes
port 6379
bind 127.0.0.1
timeout 300
keepalive 60

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# Security
requirepass your_redis_password_here

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Performance
tcp-keepalive 0
databases 16

# Append Only File
appendonly yes
appendfsync everysec