<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Get Auth Token</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-center">🔑 Get Auth Token</h1>
        
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email:</label>
                <input type="email" id="email" value="admin@test.com" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password:</label>
                <input type="password" id="password" value="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                Login & Get Token
            </button>
        </form>

        <div id="result" class="mt-6 hidden">
            <div class="p-4 bg-green-50 border border-green-200 rounded-md">
                <h3 class="font-medium text-green-800 mb-2">✅ Login Successful!</h3>
                <p class="text-sm text-gray-600 mb-2">Your Auth Token:</p>
                <div class="bg-white p-2 border rounded font-mono text-xs break-all" id="token"></div>
                <button onclick="copyToken()" 
                        class="mt-2 text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200">
                    Copy Token
                </button>
                <a href="visitor-test-dashboard.html" 
                   class="mt-2 ml-2 text-sm bg-green-100 text-green-700 px-3 py-1 rounded hover:bg-green-200 inline-block">
                    Go to Dashboard →
                </a>
            </div>
        </div>

        <div id="error" class="mt-6 hidden">
            <div class="p-4 bg-red-50 border border-red-200 rounded-md">
                <h3 class="font-medium text-red-800 mb-2">❌ Login Failed</h3>
                <p class="text-sm text-red-600" id="errorMessage"></p>
            </div>
        </div>

        <div class="mt-8 text-center text-sm text-gray-600">
            <h3 class="font-medium mb-2">Default Test Credentials:</h3>
            <p>Email: admin@test.com</p>
            <p>Password: password</p>
            <p class="mt-2 text-xs">
                Note: You may need to create this user first or check your database seeders.
            </p>
        </div>
    </div>

    <script>
        let authToken = '';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            document.getElementById('result').classList.add('hidden');
            document.getElementById('error').classList.add('hidden');

            try {
                const response = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    authToken = data.token;
                    document.getElementById('token').textContent = authToken;
                    document.getElementById('result').classList.remove('hidden');
                } else {
                    throw new Error(data.message || 'Login failed');
                }
            } catch (error) {
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('error').classList.remove('hidden');
            }
        });

        function copyToken() {
            navigator.clipboard.writeText(authToken).then(() => {
                alert('Token copied to clipboard!');
            });
        }
    </script>
</body>
</html>
