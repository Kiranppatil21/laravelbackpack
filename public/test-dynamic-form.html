<!DOCTYPE html>
<html>
<head>
    <title>Test Dynamic Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Test Dynamic Form Functionality</h2>
        
        <!-- Identity Proofs Section -->
        <div class="mt-4">
            <h4 class="text-primary">🆔 Identity Proofs</h4>
            <hr>
            
            <div id="identity-proofs-container">
                <div class="identity-proof-item border rounded p-3 mb-3" data-index="0">
                    <div class="row">
                        <div class="col-md-4">
                            <label>Document Type</label>
                            <select name="identity_proofs[0][identity_proof_type]" class="form-control" required>
                                <option value="">Select Document</option>
                                <option value="Aadhaar Card">Aadhaar Card</option>
                                <option value="PAN Card">PAN Card</option>
                                <option value="Voter ID">Voter ID</option>
                                <option value="Driving License">Driving License</option>
                                <option value="Passport">Passport</option>
                                <option value="Ration Card">Ration Card</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label>Document Number</label>
                            <input type="text" name="identity_proofs[0][identity_proof_no]" class="form-control" required>
                        </div>
                        <div class="col-md-3">
                            <label>Upload Document</label>
                            <input type="file" name="identity_proofs[0][image_file]" class="form-control" accept="image/*,application/pdf">
                        </div>
                        <div class="col-md-1">
                            <label>&nbsp;</label><br>
                            <button type="button" class="btn btn-danger btn-sm remove-identity-proof" style="display: none;">×</button>
                        </div>
                    </div>
                </div>
            </div>
            <button type="button" id="add-identity-proof" class="btn btn-success btn-sm mb-3">+ Add Identity Proof</button>
        </div>
    </div>

    <script>
        // Test script to verify Add More functionality
        setTimeout(function() {
            console.log("Testing dynamic form functionality...");
            
            let identityProofIndex = 1;
            
            const addButton = document.getElementById("add-identity-proof");
            console.log("Add button found:", !!addButton);
            
            if (addButton) {
                addButton.addEventListener("click", function() {
                    console.log("Add button clicked!");
                    
                    const container = document.getElementById("identity-proofs-container");
                    const template = document.querySelector(".identity-proof-item");
                    
                    console.log("Container found:", !!container);
                    console.log("Template found:", !!template);
                    
                    if (container && template) {
                        const newItem = template.cloneNode(true);
                        
                        // Update indices and clear values
                        newItem.setAttribute("data-index", identityProofIndex);
                        const inputs = newItem.querySelectorAll("input, select");
                        inputs.forEach(input => {
                            const name = input.getAttribute("name");
                            if (name) {
                                input.setAttribute("name", name.replace("[0]", `[${identityProofIndex}]`));
                                if (input.type !== "file") {
                                    input.value = "";
                                }
                            }
                        });
                        
                        // Show remove button for new item
                        const removeBtn = newItem.querySelector(".remove-identity-proof");
                        if (removeBtn) {
                            removeBtn.style.display = "inline-block";
                            removeBtn.addEventListener("click", function() {
                                console.log("Remove button clicked!");
                                if (container.children.length > 1) {
                                    newItem.remove();
                                    updateRemoveButtons();
                                }
                            });
                        }
                        
                        container.appendChild(newItem);
                        identityProofIndex++;
                        updateRemoveButtons();
                        
                        console.log("New item added! Current count:", container.children.length);
                    }
                });
            }
            
            function updateRemoveButtons() {
                const container = document.getElementById("identity-proofs-container");
                const removeButtons = container.querySelectorAll(".remove-identity-proof");
                
                removeButtons.forEach(btn => {
                    if (container.children.length === 1) {
                        btn.style.display = "none";
                    } else {
                        btn.style.display = "inline-block";
                    }
                });
            }
            
            updateRemoveButtons();
        }, 100);
    </script>
</body>
</html>
