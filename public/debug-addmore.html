<!DOCTYPE html>
<html>
<head>
    <title>Debug Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Debug: Check Add More Button Functionality</h2>
        
        <div class="alert alert-info">
            <p>Open browser console (F12) to see debug messages.</p>
            <p>This page will test if the Add More button JavaScript works independently.</p>
        </div>
        
        <!-- Test Add More Button -->
        <div class="mt-4">
            <h4>Test Add More Button</h4>
            <div id="test-container">
                <div class="test-item border p-2 mb-2">
                    <input type="text" name="test[0][name]" class="form-control" placeholder="Test Field 1">
                    <button type="button" class="btn btn-danger btn-sm remove-test-item" style="display: none;">Remove</button>
                </div>
            </div>
            <button type="button" id="add-test-item" class="btn btn-success btn-sm">Add More Test</button>
        </div>
        
        <script>
            console.log("Debug page loaded");
            
            let testIndex = 1;
            
            document.getElementById("add-test-item").onclick = function() {
                console.log("Add button clicked!");
                
                const container = document.getElementById("test-container");
                const template = container.querySelector(".test-item");
                const newItem = template.cloneNode(true);
                
                // Update name and clear value
                const input = newItem.querySelector("input");
                input.name = "test[" + testIndex + "][name]";
                input.value = "";
                input.placeholder = "Test Field " + (testIndex + 1);
                
                // Show remove button
                const removeBtn = newItem.querySelector(".remove-test-item");
                removeBtn.style.display = "inline-block";
                removeBtn.onclick = function() {
                    if (container.children.length > 1) {
                        newItem.remove();
                        console.log("Item removed");
                    }
                };
                
                container.appendChild(newItem);
                testIndex++;
                
                console.log("Item added, total items:", container.children.length);
            };
        </script>
    </div>
</body>
</html>
