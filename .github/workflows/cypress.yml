name: Cypress E2E

on:
  push:
    branches: [ main, phase2 ]
  pull_request:
    branches: [ main, phase2 ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install PHP dependencies
        run: |
          composer install --no-progress --no-suggest --prefer-dist

      - name: Install Node dependencies
        run: |
          npm ci

      - name: Copy env and generate key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: |
          php artisan migrate --force

      - name: Build assets
        run: |
          npm run build

      - name: Start Laravel server
        run: |
          php artisan serve --port=8000 > server.log 2>&1 &
          # wait for server to boot
          for i in {1..30}; do
            curl -sSf http://127.0.0.1:8000 && break || sleep 1
          done

      - name: Run Cypress tests
        run: |
          # Run all specs; if CYPRESS_RECORD_KEY env var is set we will run with recording + parallel
          if [ -n "$CYPRESS_RECORD_KEY" ]; then
            npx cypress run --record --parallel
          else
            npx cypress run
          fi
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
