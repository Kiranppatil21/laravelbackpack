name: PHP Unit Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    env:
      VISITOR_HMAC_TTL: '300'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        # use a stable v2 tag to avoid transient resolution issues in hosted runners
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, gd, pdo, pdo_sqlite
          ini-values: post_max_size=256M, memory_limit=2G

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: |
          npm ci

      - name: Build frontend assets (Vite)
        run: |
          npm run build --if-present

      - name: Get Composer Cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          php artisan key:generate --ansi
          # run migrations (use sqlite file created above)
          php artisan migrate --force --no-interaction

      - name: Start queue worker (background)
        run: |
          export QUEUE_CONNECTION=database
          php artisan queue:work --sleep=1 --tries=1 > /tmp/queue.log 2>&1 &

      - name: Require visitor secret (API key or HMAC)
        run: |
          if [ -z "${{ secrets.VISITOR_API_KEY }}" ] && [ -z "${{ secrets.VISITOR_HMAC_SECRET }}" ]; then echo "Missing both VISITOR_API_KEY and VISITOR_HMAC_SECRET secrets"; exit 1; fi

      - name: Seed test roles
        run: |
          php artisan db:seed --class=TestRolesSeeder --force
      - name: Seed visitor sample data
        run: |
          php artisan db:seed --class=VisitorSeeder --force

      - name: Run PHPUnit
        # Run tests; queue worker started above will process queued notifications
        run: |
          export VISITOR_API_KEY=${{ secrets.VISITOR_API_KEY }} || true
          export VISITOR_HMAC_SECRET=${{ secrets.VISITOR_HMAC_SECRET }} || true
          export VISITOR_HMAC_TTL=${{ env.VISITOR_HMAC_TTL }} || true
          export QUEUE_CONNECTION=database
          php artisan test
